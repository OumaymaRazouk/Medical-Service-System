{% extends 'Medecin/medecin.html'  %}

{% block content %}
<div class="page-wrapper">
<div class="card mt-3 ml-4" style="margin:10px;" >
<div class="card-header">
<h1>List of VMR of {{ patient.name |upper }}</h1>
<a href="{% url 'ajouter_visite_reprise' patient.id %}" class="btn btn-info" >Add</a>
</div>
<div class="container">
    <div class="table-responsive">
        <table id="zero_config" class="table border table-striped table-bordered text-nowrap">
      
        <thead>
            <tr>
                <th>Visit date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for visite in visites %}
                <tr>
                    <td>{{ visite.date|date:"d-m-Y"}}</td>
                    <td><a href="{% url 'detail_visite_reprise' patient_id=patient.id date_visite=visite.date %}">See</a></td>

                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<script>
$(document).ready(function() {
            $('#bootstrapdatatable').DataTable({
                "aLengthMenu": [[3, 5, 10, 25, -1], [3, 5, 10, 25, "All"]],
                "iDisplayLength": 10,
                "dom": 'Bfrtip', // Include the Buttons in the DataTable layout
                "buttons": ['copy', 'csv', 'excel', 'pdf', 'print']
            });
        });
</script>
{% endblock %}
