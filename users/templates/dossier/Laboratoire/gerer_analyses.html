{% extends 'Medecin/medecin.html' %}

{% block content %}

{% load static %}

<div class="page-wrapper">
    <br>
    <center><h2>Analysis management</h2></center>
     <div class="mx-8">
<form method="post" class="form-inline mb-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Add</button>
</form>

<table class="table border table-striped table-bordered text-nowrap " id="bootstrapdatatable">
    <thead>
        <tr>
            <th><center>Analysis name</center></th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for analyse in analyses %}
        <tr>
            <td style="width: 70%;"><center>{{ analyse.name }}</center></td>
            <td >
                <a href="{% url 'modifier_analyse' analyse.id %}" class="btn btn-warning">
                    <i class="fas fa-pencil-alt"></i> Update
                </a>
                <a href="{% url 'supprimer_analyse' analyse.id %}" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table></div></div>



<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/1.11.4/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>
<script>
$(document).ready(function() {
            $('#bootstrapdatatable').DataTable({
                "aLengthMenu": [[3, 5, 10, 25, -1], [3, 5, 10, 25, "All"]],
                "iDisplayLength":5,
                "dom": 'Bfrtip', // Include the Buttons in the DataTable layout
                "buttons": ['copy', 'csv', 'excel', 'pdf', 'print']
            });
        });
</script>

{%endblock%}
