{% extends 'Medecin/medecin.html'  %}

{% block content %}


<div class="page-wrapper">
<div class="page-breadcrumb">
    <div class="row">
        <div class="col-7 align-self-center">
            <h2 class="page-title text-truncate text-dark font-weight-medium mb-1">List Medical Card Of {{patient.name}}</h2>
           
        </div>
        <div class="col-5 align-self-center">
            <div class="customize-input float-end">
                <a href="{% url 'ajouter_surveillance' patient.id %}" class="btn btn-info" >Add</a>
            </div>
        </div>
    </div>
    </div>
    <div class="container-fluid">
        <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                <div class="table-responsive">
                    <table id="zero_config" class="table border table-striped table-bordered text-nowrap">
             
                       <thead>
            <tr>
                <th>Visit date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for visite in visites %}
                <tr>
                    <td>{{ visite.date|date:"d-m-Y"}}</td>
                    <td><a href="{% url 'detail_surveillance' patient_id=patient.id date_visite=visite.date %}">See</a>


                </tr>
            {% endfor %}
        </tbody>
    </table>
</div></div>
</div>
<script>
$(document).ready(function() {
            $('#bootstrapdatatable').DataTable({
                "aLengthMenu": [[3, 5, 10, 25, -1], [3, 5, 10, 25, "All"]],
                "iDisplayLength": 10,
                "dom": 'Bfrtip', // Include the Buttons in the DataTable layout
                "buttons": ['copy', 'csv', 'excel', 'pdf', 'print']
            });
        });
</script>
    {% endblock %}
