{%load static%}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'nomac.png'%}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inclure le kit Font Awesome pour utiliser les icônes -->
    <script
      src="https://kit.fontawesome.com/64d58efce2.js"
      crossorigin="anonymous"
    ></script>
    <!-- Lier votre fichier CSS personnalisé -->
    <link rel="stylesheet" href="{% static 'dist/css/styles.css' %}">
    <title>Sign in & Sign up Form</title>
  </head>
  <body>
    <div class="container">

      <div class="forms-container">

        <div class="signin-signup">
          <!-- Formulaire de connexion -->
          <form action="#" class="sign-in-form" method="POST">
            <h3>{{msg}}</h3>
            {% csrf_token%}
            <!-- Afficher le formulaire généré à partir de votre modèle Django -->
            {{ form.as_p }}
            <img src="{% static 'nomac-logo.png' %}" class="image" alt="" />
            <h2 class="title">Log in</h2>
            <!-- Champ de saisie de l'utilisateur (texte) -->
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="text" name="username"  placeholder="Username" />
            </div>
            <!-- Champ de saisie du mot de passe (mot de passe) -->
            <div class="input-field">
              <i class="fas fa-lock"></i>
              <input type="password" name="password"  placeholder="Password" />
            </div>
            <!-- Bouton de soumission du formulaire -->
            <input type="submit" value="Login" class="btn solid" />


          </form>

        </div>
        <div class="panels-container">
        <div class="panel left-panel">
          <div class="content">
            <h1>Medical Records Management</h1><br><br>

            <p>Welcome to the medical records management application. Please log in to access your account.</p>
          </div>
          <img src="{% static 'logo.png' %}" class="image" alt="" />
        </div>
        
      </div>
    </div>

    <script  src="{% static 'dist/js/script.js' %}"></script>
    </div>
  </body>
</html>
